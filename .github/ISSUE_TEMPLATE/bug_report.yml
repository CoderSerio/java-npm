name: Bug report / 缺陷反馈
description: Report a reproducible problem in the supported workflow.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese are welcome. Search existing issues first.
        Report security vulnerabilities privately to carbon1024@foxmail.com.
        Remove tokens, credentials, private paths, and private registry URLs from logs.
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Include jpm/Node versions, OS/architecture, JDK, and relevant Maven/Boot versions.
      placeholder: "jpm --version; node --version; OS; JDK; Maven/Boot if relevant"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Exact commands and a minimal manifest/configuration or public reproduction repository.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Include the error and exit status when available.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics / 脱敏诊断
      description: Relevant output from jpm doctor --json and logs. Inspect before sharing; paths and metadata may be private.
      render: text
