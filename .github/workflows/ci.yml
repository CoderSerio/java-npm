name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install and run the release archive
        shell: bash
        run: |
          archive=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent)
          npm install --prefix "$RUNNER_TEMP/jpm-install" --omit=dev --ignore-scripts "$RUNNER_TEMP/$archive"
          "$RUNNER_TEMP/jpm-install/node_modules/.bin/jpm" --version
          "$RUNNER_TEMP/jpm-install/node_modules/.bin/jpm" --help
